    <script>
      function rgbToHex(rgb) {
        let result = rgb.match(/\d+/g);
        return `#${(
          (1 << 24) |
          (parseInt(result[0]) << 16) |
          (parseInt(result[1]) << 8) |
          parseInt(result[2])
        )
          .toString(16)
          .slice(1)
          .toUpperCase()}`;
      }

      function rgbaToHex(rgba) {
        let result = rgba.match(/\d+/g);
        return rgbToHex(`rgb(${result[0]}, ${result[1]}, ${result[2]})`);
      }
      document.querySelectorAll("textarea").forEach(function (textarea) {
        textarea.addEventListener("click", function () {
          const computedStyle = window.getComputedStyle(this);
          const textFontSize = parseInt(computedStyle.fontSize);
          let textColor = computedStyle.color;

          if (textColor.startsWith("rgb")) {
            textColor = rgbToHex(textColor);
          } else if (textColor.startsWith("rgba")) {
            textColor = rgbaToHex(textColor);
          }
          console.log(textColor);
          const txtArea = this;

          // Create a new HTML div and append it to the textarea's parent
          const newHTMLDiv = document.createElement("div");
          newHTMLDiv.classList.add(
            "absolute",
            "bg-white",
            "p-4",
            "border",
            "rounded-lg",
            "flex",
            "noprint"
          );
          newHTMLDiv.style.zIndex = 9;

          newHTMLDiv.innerHTML = ` 
            <button 
              class="hover:bg-gray-200 p-1 cursor-pointer"
              onclick="changeTextAlign('left', this)">
              <svg class="h-5 w-5 text-gray-500"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round">  <line x1="17" y1="10" x2="3" y2="10" />  <line x1="21" y1="6" x2="3" y2="6" />  <line x1="21" y1="14" x2="3" y2="14" />  <line x1="17" y1="18" x2="3" y2="18" /></svg>
            </button>
            <button 
              class="hover:bg-gray-200 p-1 cursor-pointer"
              onclick="changeTextAlign('center', this)">
              <svg class="h-5 w-5 text-gray-500"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round">  <line x1="18" y1="10" x2="6" y2="10" />  <line x1="21" y1="6" x2="3" y2="6" />  <line x1="21" y1="14" x2="3" y2="14" />  <line x1="18" y1="18" x2="6" y2="18" /></svg>
            </button>
            <button
              class="hover:bg-gray-200 p-1 cursor-pointer"
                onclick="changeTextAlign('right', this)">
              <svg class="h-5 w-5 text-gray-500"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round">  <line x1="21" y1="10" x2="7" y2="10" />  <line x1="21" y1="6" x2="3" y2="6" />  <line x1="21" y1="14" x2="3" y2="14" />  <line x1="21" y1="18" x2="7" y2="18" /></svg>
            </button>

            <button
              class="hover:bg-gray-200 p-1 cursor-pointer"
              onclick="changFontWeight()"
                >
                <svg class="h-5 w-5 text-gray-500"  width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">  <path stroke="none" d="M0 0h24v24H0z"/>  <path d="M7 5h6a3.5 3.5 0 0 1 0 7h-6z" />  <path d="M13 12h1a3.5 3.5 0 0 1 0 7h-7v-7" /></svg>
            </button>

            <div class="flex mr-2 ml-2">
              <input class="border" type="number" value="${textFontSize}" 
              oninput="changeFontSize(this.value)"
              max="100"
              min="12"
              /> px
            </div>

            <div>
              <input type="color" value="${textColor}" oninput="changecolor(this.value)"/>
            </div>
          `;

          // Append new HTML below the clicked textarea
          this.parentNode.appendChild(newHTMLDiv);

          // Add click listener outside the textarea to remove the controls
          function outsideClickListener(event) {
            if (
              !txtArea.contains(event.target) &&
              !newHTMLDiv.contains(event.target)
            ) {
              newHTMLDiv.remove();
              document.removeEventListener("click", outsideClickListener);
            }
          }

          document.addEventListener("click", outsideClickListener);

          window.changeTextAlign = function (alignment, button) {
            textarea.style.textAlign = alignment;
          };
          window.changeFontSize = function (fontSize) {
            fontSize = parseInt(fontSize);
            fontSize = Math.max(12, fontSize);
            fontSize = Math.min(40, fontSize);
            textarea.style.fontSize = `${fontSize}px`;
            autoheight(textarea);
          };

          window.changecolor = function (color) {
            textarea.style.color = color;
          };

          window.changFontWeight = function () {
            if (textarea.style.fontWeight == "normal") {
              textarea.style.fontWeight = 600;
            } else {
              textarea.style.fontWeight = "normal";
            }
          };
        });
      });

      function autoheight(textarea) {
        textarea.style.height = "auto";
        textarea.style.height = textarea.scrollHeight + "px";
      }
    </script>
